<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050">
<defs><style>text{font-family:Arial,sans-serif;fill:#262626}.title{font-size:24px;font-weight:700}.label{font-size:15px}.small{font-size:12px;fill:#666}.box{fill:#fff;stroke:#bcbcbc;stroke-width:1.5}.soft{fill:#eee;stroke:#bcbcbc}.line{stroke:#ccc}</style></defs>
<rect width="1440" height="1050" fill="#f6f6f6"/>
<text x="40" y="45" class="title">Memoraid / study workspace wireframe</text><text x="40" y="72" class="label">One hierarchy across desktop and mobile. Pink, Designbyte and Classic supply the colors.</text>
<rect x="40" y="105" width="990" height="820" rx="12" class="box"/>
<path d="M225 105V925" class="line"/><text x="65" y="150" class="title">Memoraid</text><text x="65" y="176" class="small">Your study space</text>
<rect x="55" y="215" width="155" height="44" rx="8" class="soft"/><text x="72" y="242" class="label">Overview</text><text x="72" y="297" class="label">Practice</text><text x="72" y="352" class="label">Import notes</text><text x="72" y="407" class="label">History</text><text x="72" y="462" class="label">Settings</text><text x="65" y="847" class="small">Appearance control</text><text x="65" y="880" class="small">Account</text>
<text x="255" y="152" class="small">YOUR WORKSPACE</text><text x="255" y="186" class="title">A little progress, every day.</text><rect x="875" y="145" width="125" height="42" rx="8" class="soft"/><text x="895" y="171" class="label">+ New set</text>
<rect x="255" y="215" width="745" height="155" rx="12" class="soft"/><text x="280" y="248" class="small">READY WHEN YOU ARE</text><text x="280" y="280" class="title">Your next review starts here.</text><text x="280" y="305" class="label">Due count + real recommended set</text><rect x="280" y="322" width="150" height="32" rx="6" class="box"/><text x="298" y="344" class="label">Review / Create</text><text x="452" y="344" class="label">Import notes</text>
<rect x="255" y="390" width="235" height="85" rx="10" class="box"/><rect x="510" y="390" width="235" height="85" rx="10" class="box"/><rect x="765" y="390" width="235" height="85" rx="10" class="box"/><text x="275" y="420" class="small">STUDY SETS</text><text x="275" y="451" class="title">Real count</text><text x="530" y="420" class="small">DUE CARDS</text><text x="530" y="451" class="title">Real count</text><text x="785" y="420" class="small">AVERAGE SCORE</text><text x="785" y="451" class="title">Real score</text>
<text x="255" y="515" class="title">Your library</text><rect x="255" y="535" width="465" height="42" rx="8" class="box"/><text x="273" y="561" class="label">Search title, description or tag</text><text x="255" y="607" class="small">ALL SETS / DUE FOR REVIEW</text>
<rect x="255" y="625" width="222" height="160" rx="10" class="box"/><rect x="497" y="625" width="223" height="160" rx="10" class="box"/><text x="275" y="658" class="label">Deck icon + due badge</text><text x="275" y="693" class="title">Set title</text><text x="275" y="719" class="small">Description + tags</text><text x="275" y="761" class="small">Card count / last studied</text><text x="517" y="658" class="label">Same card structure</text>
<rect x="745" y="505" width="255" height="280" rx="10" class="box"/><text x="765" y="540" class="title">Daily goals</text><text x="765" y="570" class="label">Level / XP / streak</text><text x="765" y="610" class="small">Goal + actual progress</text><rect x="765" y="625" width="215" height="7" rx="3" class="soft"/><text x="765" y="669" class="small">Topic mastery bars</text><text x="765" y="705" class="small">Real data, no fake stats</text>
<rect x="255" y="810" width="745" height="85" rx="10" class="box"/><text x="275" y="842" class="label">Recent activity + View history</text><text x="275" y="869" class="small">Compact timeline, latest three entries</text>
<rect x="1070" y="105" width="330" height="820" rx="22" class="box"/><text x="1090" y="148" class="small">MOBILE / 390 PX</text><text x="1090" y="182" class="title">Your workspace</text><rect x="1090" y="210" width="290" height="155" rx="10" class="soft"/><text x="1110" y="250" class="title">Next review</text><text x="1110" y="285" class="label">Primary study action</text><rect x="1110" y="307" width="240" height="38" rx="6" class="box"/><text x="1152" y="332" class="label">Start reviewing</text>
<rect x="1090" y="385" width="290" height="75" rx="8" class="box"/><text x="1110" y="430" class="label">Three compact metrics</text><text x="1090" y="500" class="title">Your library</text><rect x="1090" y="520" width="290" height="42" rx="8" class="box"/><text x="1110" y="547" class="small">Search + filter</text><rect x="1090" y="582" width="290" height="145" rx="10" class="box"/><text x="1110" y="622" class="title">Full-width deck</text><text x="1110" y="660" class="small">Goals and activity follow below</text><text x="1090" y="777" class="small">Single scroll, no horizontal overflow</text><path d="M1070 855H1400" class="line"/><text x="1090" y="892" class="small">Home    Practice    Import    History    Settings</text>
<text x="40" y="970" class="label">Settings: Appearance | Recognition | Data &amp; sync | Advanced. Account controls live under Data &amp; sync.</text><text x="40" y="1000" class="label">Practice: Mode tabs → sources and answer workspace. Phones prioritize active answers; drafts and grading stay intact.</text><text x="40" y="1025" class="small">Implementation reference. All fills, borders, text and accents come from saved theme tokens; no database changes.</text>
</svg>
